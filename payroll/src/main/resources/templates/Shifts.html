<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" th:href="@{/style.css}">

</head>
<body class="dashboard-body">
    <nav class="sidebar-container">
        <div class="sidebar-logo">PayrollPro</div>
        <ul class="sidebar-menu">
            <a class="menu-item" href="/">Dashboard</a>
            <a class="menu-item" href="Employees">Employees</a>
            <a class="menu-item" href="Shifts">Shifts</a>
            <a class="menu-item">Payroll Run</a>
            <a class="menu-item">Settings</a>
        </ul>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <h1 class="page-title">Shifts Management</h1>
            <div class="user-profile">Admin User</div>
        </header>

        <section class="form-container">
            <h2 class="form-heading">Add a New Shift</h2>
            <form class="employee-form" th:action="@{/api/shift/addShift}" th:object="${shiftObject}" method="post">
                <div class="form-group">
                    <label class="input-label">Shift Name</label>
                    <input type="text" th:field="*{shiftName}" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="input-label">Start Time</label>
                    <input type="time" th:field="*{startTime}" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="input-label">End Time</label>
                    <input type="time" th:field="*{endTime}" class="form-input" required>
                </div>
                
                <button type="submit" class="submit-button">Save Shifts</button>
            </form>
        </section>

        <section class="table-container">
            <h2 class="table-heading">Shift List</h2>
            <table class="payroll-table">
                <thead>
                    <tr>
                        <th class="table-header">Shift Name</th>
                        <th class="table-header">Start Time</th>
                        <th class="table-header">End Time</th>
                        <th class="table-header">Duration</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="shift : ${shiftList}">
                        <td class="table-cell" th:text="${shift.getShiftName()}">Shift Name</td>
                        <td class="table-cell" th:text="${shift.getStartTime()}">Start Time</td>
                        <td class="table-cell" th:text="${shift.getEndTime()}">End Time</td>
                        
                        <td class="table-cell" th:text=" ${shift.getDurationHours()}">Duration</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
