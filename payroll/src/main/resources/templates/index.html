<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll System Dashboard</title>
    <link rel="stylesheet" th:href="@{/style.css}">

</head>
<body class="dashboard-body">
    <nav class="sidebar-container">
        <div class="sidebar-logo">PayrollPro</div>
        <div class="sidebar-menu">
            <a class="menu-item" href="">Dashboard</a>
            <a class="menu-item" href="Employees">Employees</a>
            <a class="menu-item" href="Shifts">Shifts</a>
            <a class="menu-item">Payroll Run</a>
            <a class="menu-item">Settings</a>
        </div>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <h1 class="page-title">Payroll Overview</h1>
            <div class="user-profile">Admin User</div>
        </header>
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Employees</div>
                <div class="stat-value" th:text="${numberOfEmp}">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Monthly Payroll</div>
                <div class="stat-value" th:text="'$'+${totalPayout}">$452,000</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tax Percentage</div>
                <div class="stat-value">27.5%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tax Liability</div>
                <div class="stat-value" th:text="'$'+0.275*${totalPayout}">$84,200</div>
            </div>
        </section>
        <section class="table-container">
            <h2 class="table-heading">Recent Transactions</h2>
            <table class="payroll-table">
                <thead>
                    <tr>
                        <th class="table-header">Employee Name</th>
                        <th class="table-header">Type</th>
                        <th class="table-header">Pay Date</th>
                        <th class="table-header">Amount</th>
                        <th class="table-header">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${empList}">
                        <td class="table-cell" th:text="${emp.getFirstName() + ' ' + emp.getLastName()}">John Doe</td>
                        <td class="table-cell" th:text="${emp.getType()}">Engineering</td>
                        <td class="table-cell">Jan 15, 2026</td>
                        
                        <td class="table-cell" th:text="'$' + ${emp.calculatePay()}">$5,500.00</td>
                        
                        <td class="table-cell">
                            <span class="status-paid" th:if="${emp.getPayStatus()}">Paid</span>
                            <span class="status-pending" th:if="${!emp.getPayStatus()}">Pending</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
